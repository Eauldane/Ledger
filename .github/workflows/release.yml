name: Create Release

on:
  push:
    tags: '*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.x.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
      - name: Build
        run: |
          $ver = '${{ github.ref }}' -replace 'refs/tags/',''
          invoke-expression 'dotnet build --no-restore --configuration Release --nologo -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver'
      - name: Package Release
        run: |
          $output = 'Ledger/bin/Release/win-x64'
          $zip = 'latest.zip'

          if (!(Test-Path "$output/Ledger.dll")) {
            throw "Expected release build output was not found at $output"
          }

          Compress-Archive -Path "$output/*" -DestinationPath $zip -Force
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ledger
          path: latest.zip
          if-no-files-found: error
      - name: Upload Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.RELEASE_KEY }}
          file: latest.zip
          tag: ${{ github.ref }}
          overwrite: true
